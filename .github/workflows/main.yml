name: CI

# tmp: only the Linux and macOS Game lanes, each one running its tests without coverage, with dynamic coverage,
# with static coverage, then without again

on:
  workflow_dispatch:

permissions:
  checks: write
  contents: read
  pull-requests: read

jobs:
  Linux-Tests-Game:
    uses: ./.github/workflows/test-linux-game.yml
    with:
      build-type: Debug

  macOS-Tests-Game:
    uses: ./.github/workflows/test-macos-game.yml
    with:
      build-type: Debug
