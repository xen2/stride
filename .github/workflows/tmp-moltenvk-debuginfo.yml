name: "tmp: MoltenVK iOS debug info"

# Temporary: finds where the iOS static libMoltenVK.a loses its debug info. Not for master.

on:
  push:
    branches: [tmp/moltenvk-debuginfo]

jobs:
  probe:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with: { path: stride-src, sparse-checkout: .github/scripts }

      - name: Build MoltenVK (iOS only)
        env: { XCODE_XCCONFIG_FILE: '${{ github.workspace }}/stride-src/.github/scripts/dep-debug-info.xcconfig' }
        run: |
          mkdir -p mvk-src && cd mvk-src
          git init -q
          git remote add origin https://github.com/KhronosGroup/MoltenVK.git
          git fetch --depth 1 origin v1.4.2
          git checkout -q FETCH_HEAD
          ./fetchDependencies --ios
          make ios > ../make-ios.log 2>&1 || { tail -50 ../make-ios.log; exit 1; }

      - name: Probe
        if: always()
        run: |
          set +e
          has() { if otool -l "$1" 2>/dev/null | grep -q __debug_info; then echo "DWARF   $1"; else echo "no      $1"; fi; }
          log=mvk-src/xcodebuild.log
          ls -la $log
          echo "== prelink command"
          grep -n -- '-master.o' $log | cut -c1-3000 | head -6
          cmd=$(grep -E '/ld(-classic)? .* -r .*libMoltenVK\.a-arm64-master\.o|clang.* -r .*libMoltenVK\.a-arm64-master\.o' $log | grep -v 'iphonesimulator' | head -1)
          echo "== flags of it"; echo "$cmd" | tr ' ' '\n' | grep -E '^-' | sort | uniq -c
          if [ -n "$cmd" ]; then
            master=$(echo "$cmd" | grep -oE '[^ ]*libMoltenVK\.a-arm64-master\.o' | head -1)
            echo "== rerun as is"; eval "$(echo "$cmd" | sed "s|$master|/tmp/as-is.o|")"; has /tmp/as-is.o
            echo "== rerun without -S"; eval "$(echo "$cmd" | sed "s|$master|/tmp/no-S.o|; s| -S | |g")"; has /tmp/no-S.o
            echo "== rerun with -ld_classic"; eval "$(echo "$cmd" | sed "s|$master|/tmp/classic.o|; s| -S | |g; s| -r | -r -ld_classic |")"; has /tmp/classic.o
          fi
