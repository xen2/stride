name: Test Editor (Avalonia)

# Builds the cross-platform (Avalonia) editor and runs its test projects on Linux and Windows,
# with a coverage report of the editor-side assemblies (no threshold: the summary is informative).
# The WPF editor stays covered by build-windows-full.yml (its build), test-editor-wpf.yml (its tests)
# and test-gamestudio-screenshots.yml (its screenshots).

on:
  workflow_dispatch:
    inputs:
      build-type:
        description: Build Configuration
        default: Debug
        type: choice
        options:
          - Debug
          - Release
      test-filter:
        description: 'dotnet test --filter expression (blank = all tests)'
        type: string
        default: ''
      repeat:
        description: 'Rerun the filtered test set up to N times, stop on first failure (flake hunting). 1 = single run (default).'
        type: number
        default: 1
  workflow_call:
    inputs:
      build-type:
        default: Debug
        type: string
      test-filter:
        default: ''
        type: string
      repeat:
        default: 1
        type: number

concurrency:
  # A manual run never cancels or queues behind another one
  group: test-editor-avalonia-${{ github.event.pull_request.number || (github.event_name == 'workflow_dispatch' && github.run_id) || github.sha }}-${{ github.event.inputs.build-type || inputs.build-type || 'Debug' }}
  cancel-in-progress: true

env:
  # The solution filter of the Avalonia editor and its tests (a subset of Stride.slnx).
  EDITOR_SOLUTION: sources/Stride.Editor.Avalonia.slnf
  # Coverage restricted to the editor-side assemblies.
  EDITOR_RUNSETTINGS: tests/editor-coverage.runsettings
  REPORTGENERATOR_VERSION: 5.4.18
  BUILD_TYPE: ${{ github.event.inputs.build-type || inputs.build-type || 'Debug' }}

jobs:
  Editor-Tests:
    name: ${{ matrix.name }} (Editor Avalonia, ${{ github.event.inputs.build-type || inputs.build-type || 'Debug' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            platform: Linux
          - name: Windows
            os: windows-2025-vs2026
            platform: Windows
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          ref: ${{ github.ref }}
      - uses: ./.github/actions/lfs-pull
      - name: Install dependencies
        if: runner.os == 'Linux'
        # lld links the native code the filter builds (Stride.Native.targets, Stride.CrashReport); the Vulkan
        # loader for the tests that open a graphics device
        run: sudo apt-get update && sudo apt-get install -y libvulkan1 lld
      # ContinuousIntegrationBuild=false keeps the real source paths in the pdbs (CI=true maps them to /_/),
      # so that the coverage report finds the sources; this job ships no package.
      - name: Build
        run: |
          dotnet build "$EDITOR_SOLUTION" \
            -nr:false \
            -v:m -p:WarningLevel=0 \
            -p:Configuration="$BUILD_TYPE" \
            -p:StridePlatforms=${{ matrix.platform }} \
            -p:ContinuousIntegrationBuild=false
      # Stride.GameStudio.Avalonia.Tests runs its tests one at a time (the application and the plugin registry are
      # process-wide), which would make it the longest part of the job. Its classes are split by the first letter of
      # their name over processes that run side by side; the first part runs with the other test projects, and the
      # last one takes every letter the others don't. Each part logs to its own file, shown in a group once all have ended.
      - name: Test
        run: |
          FILTER="${{ github.event.inputs.test-filter || inputs.test-filter }}"
          REPEAT="${{ github.event.inputs.repeat || inputs.repeat || '1' }}"
          NS=Stride.GameStudio.Avalonia.Tests
          log=TestResults/console; mkdir -p $log
          # The test classes of the shell whose name starts with one of the letters, or with none of them
          starting() { local f= l; for l in "$@"; do f+="${f:+|}FullyQualifiedName~$NS.$l"; done; echo "$f"; }
          not_starting() { local f= l; for l in "$@"; do f+="${f:+&}FullyQualifiedName!~$NS.$l"; done; echo "$f"; }
          # tmp benchmark: 2, 3 and 4 parts on the same runner, each twice (2 3 4 4 3 2), balanced on the test times
          # per first letter; the first part runs with the other test projects, the last one takes the other letters
          timing=$log/timing.md
          # The coverage collector rewrites the instrumented assemblies in the folder a test process runs from (static
          # instrumentation on Linux): each process of the shell tests but the first runs from a copy of its own
          shell_out=(bin/Tests/$NS/*/"$BUILD_TYPE")
          [ ${#shell_out[@]} -eq 1 ] && [ -d "$shell_out" ] || { echo "::error::Not one output folder of $NS: ${shell_out[*]}"; exit 1; }
          t=$(date +%s)
          for k in 2 3 4; do cp -r "$shell_out" "$shell_out-p$k"; done
          { echo "Copies of $shell_out ($(du -sh "$shell_out" | cut -f1)): $(( $(date +%s) - t )) s for 3"; echo; } > $timing
          { echo "| Run | Parts | Wall (s) | Per part (s) |"; echo "|---|---|---|---|"; } >> $timing
          # Starts the tests of a part in the background and writes its seconds: name, solution or test assembly, filter
          run_part() {
            local config=()
            [[ $2 == *.dll ]] || config=(--no-build -p:Configuration="$BUILD_TYPE")
            ( t=$(date +%s)
              dotnet test "$2" \
                --settings "$EDITOR_RUNSETTINGS" \
                --logger:"trx;LogFilePrefix=run-$i-$1" --results-directory TestResults \
                --blame-hang-timeout 5m --blame-hang-dump-type full \
                "${config[@]}" \
                --filter "$3" > $log/run-$i-$1.log 2>&1
              rc=$?; echo $(( $(date +%s) - t )) > $log/run-$i-$1.sec; exit $rc ) &
            parts+=("$1"); pids+=($!)
          }
          # One split: the letters of each part but the last, space-separated
          split() {
            local n=$(( $# + 1 )) all= k=1 set t0=$(date +%s) per=
            parts=(); pids=()
            for set in "$@"; do
              if [ $k -eq 1 ]; then run_part p1 "$EDITOR_SOLUTION" "FullyQualifiedName!~$NS.|$(starting $set)"
              else run_part p$k "$shell_out-p$k/$NS.dll" "$(starting $set)"; fi
              all+="$set "; k=$((k+1))
            done
            run_part p$k "$shell_out-p$k/$NS.dll" "$(not_starting $all)"
            for j in "${!parts[@]}"; do
              wait ${pids[$j]} || { echo "::error::Run $i ($n parts): part ${parts[$j]} failed"; status=1; }
            done
            for p in "${parts[@]}"; do per+="$p=$(cat $log/run-$i-$p.sec) "; done
            echo "| $i | $n | $(( $(date +%s) - t0 )) | $per|" >> $timing
            for p in "${parts[@]}"; do echo "::group::Run $i ($n parts) $p"; cat $log/run-$i-$p.log; echo "::endgroup::"; done
            i=$((i+1))
          }
          status=0; i=1
          split "S U C"
          split "S C" "P R U"
          split "S R" "U A" "P D E"
          split "S R" "U A" "P D E"
          split "S C" "P R U"
          split "S U C"
          cat $timing; cat $timing >> $GITHUB_STEP_SUMMARY
          exit $status
      - name: Publish Test Report
        if: always()
        uses: phoenix-actions/test-reporting@v16
        with:
          name: 'Test Report: ${{ matrix.name }} Editor Avalonia'
          path: TestResults/*.trx
          reporter: dotnet-trx
          output-to: step-summary
          list-tests: 'failed'
      # ReportGenerator as a pinned dotnet tool rather than its action: the same command runs locally,
      # and no further third-party action is needed.
      - name: Coverage report
        if: always()
        run: |
          shopt -s globstar nullglob
          REPORTS=(TestResults/**/*.cobertura.xml)
          if [ ${#REPORTS[@]} -eq 0 ]; then echo "No coverage file found."; exit 0; fi
          dotnet tool install dotnet-reportgenerator-globaltool --version "$REPORTGENERATOR_VERSION" --tool-path .tools
          IFS=';'
          .tools/reportgenerator \
            "-reports:${REPORTS[*]}" \
            -targetdir:CoverageReport \
            "-reporttypes:Html;Cobertura;MarkdownSummaryGithub" \
            "-filefilters:-*/obj/*" \
            "-title:Editor Avalonia (${{ matrix.name }})"
          # Generated sources (obj/) are left out above; the method coverage row only links to ReportGenerator Pro.
          {
            echo "## Coverage: ${{ matrix.name }} Editor Avalonia"
            tail -n +2 CoverageReport/SummaryGithub.md | grep -v 'Method coverage:'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-editor-avalonia-${{ matrix.platform }}
          path: TestResults/
          if-no-files-found: ignore
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-editor-avalonia-${{ matrix.platform }}
          path: CoverageReport/
          if-no-files-found: ignore
