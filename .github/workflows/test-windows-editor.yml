name: Test GameStudio (Screenshots)

on:
  workflow_dispatch:
    inputs:
      build-type:
        description: Build
        default: Debug
        type: choice
        options:
          - Debug
          - Release
      graphics-api:
        description: Only this graphics API (blank = all)
        default: ''
        type: choice
        options:
          - ''
          - Direct3D11
          - Direct3D12
          - Vulkan
      display:
        description: Virtual display (none = runner default display)
        default: '3840x2160'
        type: choice
        options:
          - '3840x2160'
          - '1920x1080'
          - none
          - hyperv-1080
          - vdd-keep-hyperv
          - vdd-sdr
          - amyuni
  workflow_call:
    inputs:
      build-type:
        default: Debug
        type: string
    secrets:
      ANTHROPIC_API_KEY:
        required: false
  schedule:
    # Daily at 05:17 UTC — offset off top-of-hour to avoid GitHub Actions cron load spikes;
    # gap from test-enduser (04:37) so they don't compete for runners.
    - cron: '17 5 * * *'

concurrency:
  group: test-windows-editor-${{ github.event.pull_request.number || github.sha }}-${{ inputs.display }}
  cancel-in-progress: true

jobs:
  # Editor drift is non-deterministic enough that the LPIPS comparator relies on Claude vision as a
  # tiebreak on borderline frames. With ANTHROPIC_API_KEY the comparator resolves those inline; without
  # it (typical on fork PRs, where secrets aren't exposed) the borderline frames are captured and marked
  # "deferred" in <fixture>/vision-deferred.json, and pr-screenshot-vision-gate re-judges them with the
  # key on the uploaded artifacts. Hard LPIPS drift (no vision tiebreak) still fails here regardless.
  #
  # Fork-friendly: schedule fires only when STRIDE_ENABLE_SCHEDULED_CI is set on the repo.
  # workflow_dispatch / workflow_call always run.
  Run:
    if: >
      github.event_name != 'schedule'
      || vars.STRIDE_ENABLE_SCHEDULED_CI == 'true'
    name: Windows (Editor, ${{ matrix.graphics-api }}, ${{ inputs.build-type || 'Debug' }})
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        # Game Studio runs on each API; the games the fixtures build stay on Direct3D11.
        graphics-api: ${{ fromJSON(inputs.graphics-api && format('["{0}"]', inputs.graphics-api) || '["Direct3D11", "Direct3D12", "Vulkan"]') }}
    env:
      # Read by GraphicsApiSelector at Game Studio startup.
      STRIDE_GRAPHICS_API: ${{ matrix.graphics-api }}
      # No STRIDE_VULKAN_SYNC_VALIDATION here: on Lavapipe it slows the thumbnails to about one per second, and the
      # fixtures time out. The game tests and the enduser samples run the same rendering code with it on.
      # MSBuild property (read from the environment): a fresh checkout only builds Direct3D11, so
      # stage the requested API next to it.
      StrideGraphicsApis: ${{ matrix.graphics-api != 'Direct3D11' && format('Direct3D11;{0}', matrix.graphics-api) || '' }}
      DOTNET_DbgEnableMiniDump: "1"
      DOTNET_DbgMiniDumpType: "1"
      DOTNET_DbgMiniDumpName: "${{ github.workspace }}\\crash-dumps\\dotnet_%p.dmp"
      # Crash-report store (asset compiler, GameStudio) lands in the uploaded crash-dumps artifact.
      STRIDE_CRASH_DIR: "${{ github.workspace }}\\crash-dumps\\crash-reports"
    steps:
      # Bootstrap .github so the local composite action below is resolvable pre-checkout.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github
      # Full checkout (no samples exclude): the editor build preprocesses the template source
      # under samples/NewGame via Stride.Templates.Games.
      - uses: ./.github/actions/stride-checkout
        with:
          ref: ${{ github.ref }}

      - name: Configure crash dumps
        shell: pwsh
        run: |
          reg add "HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting" /v DontShowUI /t REG_DWORD /d 1 /f
          $dumpDir = "${{ github.workspace }}\crash-dumps"
          New-Item -Path $dumpDir -ItemType Directory -Force | Out-Null
          reg add "HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps" /v DumpFolder /t REG_EXPAND_SZ /d $dumpDir /f
          reg add "HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps" /v DumpType /t REG_DWORD /d 1 /f
          reg add "HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps" /v DumpCount /t REG_DWORD /d 10 /f

      # Temporary DWM out-of-memory instrumentation: one full dwm.exe dump, and a memory log for the whole job
      - name: Start memory log
        shell: pwsh
        run: |
          $fullDir = "${{ github.workspace }}\dwm-full-dumps"
          New-Item -Path $fullDir -ItemType Directory -Force | Out-Null
          $dwmKey = "HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\dwm.exe"
          reg add $dwmKey /v DumpFolder /t REG_EXPAND_SZ /d $fullDir /f
          reg add $dwmKey /v DumpType /t REG_DWORD /d 2 /f
          reg add $dwmKey /v DumpCount /t REG_DWORD /d 1 /f
          Get-CimInstance Win32_ComputerSystem | Format-List TotalPhysicalMemory, NumberOfLogicalProcessors
          Get-CimInstance Win32_PageFileUsage | Format-Table Name, AllocatedBaseSize, CurrentUsage, PeakUsage
          $script = "${{ runner.temp }}\memlog.ps1"
          Set-Content -Path $script -Value @'
          $log = $args[0]
          $i = 0
          while ($true) {
              try {
                  $os = Get-CimInstance Win32_OperatingSystem
                  $limit = [int]($os.TotalVirtualMemorySize / 1024)
                  $commit = $limit - [int]($os.FreeVirtualMemory / 1024)
                  $avail = [int]($os.FreePhysicalMemory / 1024)
                  $dwm = @(Get-Process dwm -ErrorAction SilentlyContinue | ForEach-Object {
                      "dwm pid=$($_.Id) priv=$([int]($_.PrivateMemorySize64 / 1MB)) ws=$([int]($_.WorkingSet64 / 1MB)) handles=$($_.HandleCount)" })
                  if ($dwm.Count -eq 0) { $dwm = @('dwm none') }
                  $line = '{0:HH:mm:ss} commit={1}/{2}MB avail={3}MB {4}' -f (Get-Date).ToUniversalTime(), $commit, $limit, $avail, ($dwm -join ' ')
                  if ($i % 5 -eq 0) {
                      $top = Get-Process | Sort-Object PrivateMemorySize64 -Descending | Select-Object -First 6 |
                          ForEach-Object { "$($_.ProcessName)($($_.Id))=$([int]($_.PrivateMemorySize64 / 1MB))" }
                      $line += ' top: ' + ($top -join ' ')
                  }
                  Add-Content -Path $log -Value $line
              } catch {
                  Add-Content -Path $log -Value "error: $_"
              }
              $i++
              Start-Sleep -Seconds 2
          }
          '@
          $log = "${{ github.workspace }}\crash-dumps\memlog.txt"
          Start-Process pwsh -WindowStyle Hidden -ArgumentList '-NoProfile', '-File', $script, $log

      # PackageStore.LoadDefaultSettings(null) only reads the user + machine NuGet configs,
      # not the workspace nuget.config — register bin/packages in the user config.
      - name: Register bin/packages with user NuGet config
        shell: pwsh
        run: |
          New-Item -Path "$env:APPDATA\NuGet" -ItemType Directory -Force | Out-Null
          dotnet nuget add source "${{ github.workspace }}\bin\packages" --name stride-local --configfile "$env:APPDATA\NuGet\NuGet.Config"

      # GH runners default to a 0x0 fallback display; WPF clamps the editor to that. The
      # composite action installs an IDD virtual display so we get a real desktop surface.
      - name: Set display resolution
        if: inputs.display != 'none' && inputs.display != 'hyperv-1080' && inputs.display != 'amyuni'
        uses: ./.github/actions/set-display-resolution-vdd
        with:
          width: ${{ inputs.display == '1920x1080' && '1920' || '3840' }}
          height: ${{ inputs.display == '1920x1080' && '1080' || '2160' }}
          keep-hyperv: ${{ inputs.display == 'vdd-keep-hyperv' && 'true' || 'false' }}
          extra-settings: ${{ inputs.display == 'vdd-sdr' && '<colour><SDR10bit>false</SDR10bit><HDRPlus>false</HDRPlus><ColourFormat>RGB</ColourFormat></colour><cursor><HardwareCursor>false</HardwareCursor></cursor>' || '' }}

      # Experiment: Amyuni usbmmidd_v2, another signed IDD virtual display, as the only display
      - name: Install Amyuni virtual display
        if: inputs.display == 'amyuni'
        timeout-minutes: 5
        shell: pwsh
        run: |
          $dir = Join-Path $env:TEMP "usbmmidd"
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          Invoke-WebRequest -Uri "https://www.amyuni.com/downloads/usbmmidd_v2.zip" -OutFile "$dir\usbmmidd.zip" -UseBasicParsing
          Expand-Archive -Path "$dir\usbmmidd.zip" -DestinationPath $dir -Force
          $pkg = Join-Path $dir "usbmmidd_v2"
          $certificates = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2Collection
          $certificates.Import([System.IO.File]::ReadAllBytes("$pkg\usbmmidd.cat"))
          foreach ($cert in $certificates) {
              $certPath = Join-Path $dir "$($cert.Thumbprint).cer"
              [System.IO.File]::WriteAllBytes($certPath, $cert.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert))
              Import-Certificate -FilePath $certPath -CertStoreLocation "Cert:\LocalMachine\TrustedPublisher" | Out-Null
          }
          Push-Location $pkg
          .\deviceinstaller64.exe install usbmmidd.inf usbmmidd
          # The monitor's default mode, also the one it comes back in after a PnP cycle
          $monitors = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\WUDF\Services\usbmmIdd\Parameters\Monitors"
          New-Item -Path $monitors -Force | Out-Null
          Set-ItemProperty -Path $monitors -Name '(Default)' -Value '3840,2160'
          Get-ItemProperty -Path $monitors | Format-List
          .\deviceinstaller64.exe enableidd 1
          Pop-Location
          Start-Sleep -Seconds 10
          # The install may open an advertisement page
          Get-Process msedge, chrome, firefox, iexplore -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Get-PnpDevice -Class Display | Format-Table FriendlyName, Status, InstanceId
          $hyperv = Get-PnpDevice -Class Display | Where-Object { $_.FriendlyName -like "*Hyper-V*" }
          foreach ($dev in $hyperv) { Disable-PnpDevice -InstanceId $dev.InstanceId -Confirm:$false -ErrorAction Continue }
          Start-Sleep -Seconds 5
          Get-PnpDevice -Class Display | Format-Table FriendlyName, Status
          Get-PnpDevice -Class Monitor -ErrorAction SilentlyContinue | Format-Table FriendlyName, Status

      # Before the display mode: its PnP cycle brings the monitor back in its default mode
      - name: Set DPI for the Amyuni display
        if: inputs.display == 'amyuni'
        uses: ./.github/actions/set-monitor-dpi
        with:
          target-dpi: '100'
          monitor-height: '2160'

      # Experiment: the stock Hyper-V Video adapter (caps at 1920x1080), or the Amyuni display at 3840x2160
      - name: Set display mode
        if: inputs.display == 'hyperv-1080' || inputs.display == 'amyuni'
        shell: pwsh
        run: |
          Add-Type @'
          using System;
          using System.Collections.Generic;
          using System.Runtime.InteropServices;
          public static class DisplayModes
          {
              [StructLayout(LayoutKind.Sequential, CharSet = CharSet.Unicode)]
              public struct DEVMODE
              {
                  [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string dmDeviceName;
                  public short dmSpecVersion, dmDriverVersion, dmSize, dmDriverExtra;
                  public int dmFields, dmPositionX, dmPositionY, dmDisplayOrientation, dmDisplayFixedOutput;
                  public short dmColor, dmDuplex, dmYResolution, dmTTOption, dmCollate;
                  [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string dmFormName;
                  public short dmLogPixels;
                  public int dmBitsPerPel, dmPelsWidth, dmPelsHeight, dmDisplayFlags, dmDisplayFrequency;
                  public int dmICMMethod, dmICMIntent, dmMediaType, dmDitherType, dmReserved1, dmReserved2, dmPanningWidth, dmPanningHeight;
              }
              [DllImport("user32.dll", CharSet = CharSet.Unicode)]
              static extern bool EnumDisplaySettings(string deviceName, int modeNum, ref DEVMODE devMode);
              public static List<string> List()
              {
                  var modes = new List<string>();
                  var mode = new DEVMODE { dmSize = (short)Marshal.SizeOf(typeof(DEVMODE)) };
                  for (var i = 0; EnumDisplaySettings(null, i, ref mode); i++)
                  {
                      var text = mode.dmPelsWidth + "x" + mode.dmPelsHeight;
                      if (!modes.Contains(text)) modes.Add(text);
                  }
                  return modes;
              }
          }
          '@
          Write-Host "Modes: $([DisplayModes]::List() -join ', ')"
          # Set-DisplayResolution accepts an unsupported mode without changing anything: check the result
          $width = ${{ inputs.display == 'amyuni' && '3840' || '1920' }}
          $height = ${{ inputs.display == 'amyuni' && '2160' || '1080' }}
          Set-DisplayResolution -Width $width -Height $height -Force
          Start-Sleep -Seconds 5
          Get-CimInstance Win32_VideoController | Format-Table Name, CurrentHorizontalResolution, CurrentVerticalResolution
          Add-Type -AssemblyName System.Windows.Forms
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          Write-Host "Primary screen: $($bounds.Width)x$($bounds.Height)"

      # No GPU on the runner: Lavapipe, with the validation layers
      - name: Set up Vulkan
        if: matrix.graphics-api == 'Vulkan'
        uses: ./.github/actions/setup-vulkan-windows

      - name: Build Stride.GameStudio.AutoTesting
        run: |
          dotnet build sources\editor\Stride.GameStudio.AutoTesting\Stride.GameStudio.AutoTesting.csproj `
            -nr:false -v:m -p:WarningLevel=0 `
            -p:Configuration=${{ inputs.build-type || 'Debug' }}

      - name: Build Stride.Editor.Tests
        run: |
          dotnet build tests\editor\Stride.Editor.Tests.csproj `
            -nr:false -v:m -p:WarningLevel=0 `
            -p:Configuration=${{ inputs.build-type || 'Debug' }}

      # Pre-test snapshot of NuGet state: bin/packages timestamps+sizes (catches partial writes
      # or out-of-order packing), NuGet global cache extractions for Stride.*, and the user
      # nuget config (which sources/mapping the sample restore will see).
      - name: Diagnostic — NuGet state pre-test
        shell: pwsh
        run: |
          Write-Host "=== bin/packages Stride.* (name, size, mtime) ==="
          Get-ChildItem bin\packages\Stride.*.nupkg -ErrorAction SilentlyContinue |
            Format-Table Name, Length, LastWriteTimeUtc -AutoSize
          Write-Host "=== NuGet global cache: stride.* extractions ==="
          $cache = "$env:UserProfile\.nuget\packages"
          if (Test-Path $cache) {
            Get-ChildItem "$cache\stride.*" -Directory -ErrorAction SilentlyContinue |
              Get-ChildItem -Directory -ErrorAction SilentlyContinue |
              Format-Table FullName, LastWriteTimeUtc -AutoSize
          } else { "No global packages cache at $cache" }
          Write-Host "=== NuGet sources (user config) ==="
          dotnet nuget list source --configfile "$env:APPDATA\NuGet\NuGet.Config"
          Write-Host "=== User NuGet.Config ==="
          if (Test-Path "$env:APPDATA\NuGet\NuGet.Config") { Get-Content "$env:APPDATA\NuGet\NuGet.Config" }

      # EditorScreenshotTests.Capture is an xunit [Theory] over Fixtures(); each entry spawns
      # the AutoTesting CLI as a subprocess (per-fixture WPF singleton-state isolation),
      # snapshots the runner output into <worktree>/ui-test-out-dpi<N>/<fixture>/, then runs
      # ScreenshotComparator.Compare against tests/editor/baselines/dpi<N>/. ANTHROPIC_API_KEY
      # opts the comparator into Claude vision second-opinions on frames that exceed LPIPS —
      # cost is bounded because Claude only fires on already-failing frames.
      - name: Display state before tests
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          foreach ($screen in [System.Windows.Forms.Screen]::AllScreens) {
              Write-Host "Screen $($screen.DeviceName) primary=$($screen.Primary) bounds=$($screen.Bounds.Width)x$($screen.Bounds.Height) work=$($screen.WorkingArea.Width)x$($screen.WorkingArea.Height)"
          }

      - name: Run editor screenshot tests
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          dotnet test tests\editor\Stride.Editor.Tests.csproj `
            --no-build `
            --filter "FullyQualifiedName~Stride.Editor.Tests.EditorScreenshotTests" `
            --logger "trx;LogFileName=editor-screenshots.trx" `
            --results-directory TestResults `
            -p:Configuration=${{ inputs.build-type || 'Debug' }}

      - name: Diagnostic — memory and DWM events
        if: always()
        shell: pwsh
        run: |
          $out = "${{ github.workspace }}\crash-dumps\events.txt"
          & {
              '=== Resource exhaustion (System log) ==='
              Get-WinEvent -FilterHashtable @{ LogName = 'System'; ProviderName = 'Microsoft-Windows-Resource-Exhaustion-Detector' } -ErrorAction SilentlyContinue |
                  Format-List TimeCreated, Id, Message
              '=== dwm.exe crashes (Application log) ==='
              $crashes = @(Get-WinEvent -FilterHashtable @{ LogName = 'Application'; ProviderName = 'Application Error' } -ErrorAction SilentlyContinue |
                  Where-Object Message -match 'dwm\.exe')
              "count=$($crashes.Count)"
              if ($crashes.Count -gt 0) {
                  "first=$($crashes[-1].TimeCreated.ToUniversalTime()) last=$($crashes[0].TimeCreated.ToUniversalTime()) (UTC)"
                  $crashes | Select-Object -Last 2 | Format-List TimeCreated, Message
              }
              '=== Other DWM events (Application log) ==='
              Get-WinEvent -LogName Application -MaxEvents 3000 -ErrorAction SilentlyContinue |
                  Where-Object { $_.ProviderName -match 'Dwm|Desktop Window Manager' } | Select-Object -First 20 |
                  Format-List TimeCreated, ProviderName, Id, Message
              '=== Memory log tail ==='
              Get-Content "${{ github.workspace }}\crash-dumps\memlog.txt" -Tail 10 -ErrorAction SilentlyContinue
          } *>&1 | Tee-Object -FilePath $out
          Get-ChildItem "${{ github.workspace }}\dwm-full-dumps" -ErrorAction SilentlyContinue | Format-Table Name, Length

      - name: Upload full dwm.exe dump
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: editor-dwm-full-dump-${{ matrix.graphics-api }}
          path: dwm-full-dumps/
          if-no-files-found: ignore
          retention-days: 3

      - name: Publish test report
        if: always()
        uses: phoenix-actions/test-reporting@v16
        with:
          name: 'Editor screenshot regression (${{ matrix.graphics-api }})'
          path: TestResults/*.trx
          reporter: dotnet-trx
          output-to: step-summary

      # Named screenshots-* so the trusted vision gate's download pattern (screenshots-*) picks it up
      # alongside the enduser captures and re-judges any deferred frames.
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-editor-${{ matrix.graphics-api }}
          path: ui-test-out-dpi*/
          if-no-files-found: warn

      - name: Upload crash dumps
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: editor-crash-dumps-${{ matrix.graphics-api }}
          path: crash-dumps/
          if-no-files-found: ignore

      # Sample's project.assets.json (NuGet resolution record) + csproj/sln, plus the actual
      # Stride.Engine/Core.Serialization DLLs that ended up in the sample's bin (their content
      # reveals which version was materialized, independent of what assets.json claims).
      - name: Upload generated sample obj/ + materialized engine DLLs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: editor-sample-obj-${{ matrix.graphics-api }}
          path: |
            C:\Users\runneradmin\AppData\Local\Temp\stride-editor-tests\**\obj\project.assets.json
            C:\Users\runneradmin\AppData\Local\Temp\stride-editor-tests\**\*.csproj
            C:\Users\runneradmin\AppData\Local\Temp\stride-editor-tests\**\*.sln
            C:\Users\runneradmin\AppData\Local\Temp\stride-editor-tests\**\bin\**\Stride.Engine.dll
            C:\Users\runneradmin\AppData\Local\Temp\stride-editor-tests\**\bin\**\Stride.Core.Serialization.dll
          if-no-files-found: warn
          retention-days: 7
